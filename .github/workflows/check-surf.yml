name: Check Surf Conditions

on:
  schedule:
    - cron: "0 * * * *" # ogni ora, tutti i giorni
  workflow_dispatch: {} # permette di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Controlla condizioni surf
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node scripts/check-surf.mjs

      - name: Salva stato notifiche
        run: |
          git config user.name "surf-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: aggiorna stato notifiche"
          git push
